name: model-backup

# grill 앱·모델 탭이 쓰는 모델 파일을 R2에 백업한다 (backup.sh, stream.py).
# 로비가 새 앱·모델을 올리면 깨우고(workflow_dispatch), 하루 한 번은 저절로 돈다.
# 여러 번 깨워도 동시에 돈다: 로비가 일을 러너마다 나눠 맡기므로(backup_claim) 같은 파일을 두 번 받지 않는다.
#
# 보안 (공개 저장소):
# - 비밀값은 Secrets로만 넘기고 출력하지 않는다. 로그에는 sha256 앞 8자리와 개수만 남긴다.
# - workflow_dispatch·schedule·main push(시험만)로만 돈다. 포크 PR로는 돌지 않는다 (pull_request·pull_request_target 없음).
# - 토큰 권한은 읽기만, 외부 액션은 커밋 해시로 고정한다.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: pip install --quiet boto3 && python3 -m unittest discover -s tests

  # 아직 아무도 맡지 않은 일을 보고 러너 수를 정한다 (받을 파일 3개당 1대, 최대 4대, 없으면 0)
  plan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          LOBBY_URL: ${{ vars.GRILL_LOBBY_URL }}
          BACKUP_SECRET: ${{ secrets.GRILL_BACKUP_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -z "$LOBBY_URL" ] || [ -z "$BACKUP_SECRET" ] || [ -z "$R2_ACCESS_KEY_ID" ]; then echo "설정이 없어 건너뜁니다"; echo "shards=[]" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 응답 코드만 남긴다 (403: GRILL_BACKUP_SECRET이 로비와 다르거나 로비를 다시 배포하지 않음, 404: GRILL_LOBBY_URL이 틀림)
          code=$(curl -sS --retry 3 -o plan.json -w '%{http_code}' -H "Authorization: Bearer $BACKUP_SECRET" "${LOBBY_URL%/}/api/backups/plan" || echo 000)
          echo "로비 응답: $code"
          [ "$code" = 200 ] || { echo "::error::로비 응답 $code"; exit 1; }
          n=$(jq -r '.shards' plan.json)
          echo "러너: $n"
          echo "shards=$(jq -c --argjson n "$n" -n '[range(0; $n)]')" >> "$GITHUB_OUTPUT"

  backup:
    needs: plan
    if: needs.plan.outputs.shards != '[]' && needs.plan.outputs.shards != ''
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: 준비
        run: pip install --quiet boto3
      - name: 백업
        env:
          LOBBY_URL: ${{ vars.GRILL_LOBBY_URL }}
          BACKUP_SECRET: ${{ secrets.GRILL_BACKUP_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          CIVITAI_API_KEY: ${{ secrets.CIVITAI_API_KEY }}
          WORKER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
        run: bash backup.sh
